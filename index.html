<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkedIn Post Board – IIMB GSK Women Support Group</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #F7F3FF;
    min-height: 100vh;
    padding: 24px 16px 60px;
    color: #1a1a2e;
  }
  .header { text-align: center; margin-bottom: 28px; }
  .badge {
    display: inline-block;
    background: #e8d5ff;
    color: #4B0082;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  h1 { font-size: 1.9rem; color: #4B0082; }
  .subtitle { color: #7c6a9a; margin-top: 6px; font-size: 0.95rem; }
  .card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 2px 12px rgba(75,0,130,0.08);
    max-width: 640px;
    margin: 0 auto 24px;
  }
  .card h2 { font-size: 1rem; color: #4B0082; margin-bottom: 14px; }
  input[type="text"] {
    border: 1.5px solid #ddd;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.9rem;
    font-family: inherit;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 10px;
  }
  input:focus { border-color: #7c3aed; }
  .row { display: flex; gap: 10px; }
  .row input { flex: 1; margin-bottom: 0; }
  .btn {
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .btn-primary { background: #4B0082; color: white; }
  .btn-primary:hover { background: #6a0dad; }
  .btn-primary:disabled { background: #c4b5d4; cursor: not-allowed; }
  .btn-outline { background: white; border: 1.5px solid #7c3aed; color: #7c3aed; }
  .btn-outline:hover { background: #7c3aed; color: white; }
  .topbar {
    max-width: 640px;
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .pill {
    background: #e8d5ff;
    color: #4B0082;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
  }
  .posts { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .post-card {
    background: white;
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 2px 8px rgba(75,0,130,0.07);
    display: flex;
    align-items: center;
    gap: 12px;
    animation: fadeUp 0.25s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #c084fc, #7c3aed);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
  }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 600; font-size: 0.9rem; }
  .meta { font-size: 0.78rem; color: #9b87b5; margin-top: 2px; }
  .actions { display: flex; gap: 7px; flex-shrink: 0; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .btn-open {
    background: #4B0082; color: white; text-decoration: none;
    border-radius: 8px; padding: 7px 13px; font-size: 0.82rem;
    font-weight: 600; display: inline-flex; align-items: center;
    gap: 4px; transition: background 0.2s;
  }
  .btn-open:hover { background: #6a0dad; }
  .del-btn {
    background: none; border: none; cursor: pointer;
    color: #ccc; font-size: 1rem; padding: 4px; transition: color 0.2s;
  }
  .del-btn:hover { color: #f87171; }
  .empty { text-align: center; padding: 40px 20px; color: #b0a0cc; }
  .empty-icon { font-size: 2.5rem; margin-bottom: 10px; }
  .divider {
    max-width: 640px; margin: 0 auto 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .divider span { font-size: 0.8rem; font-weight: 600; color: #9b87b5; text-transform: uppercase; letter-spacing: 0.07em; white-space: nowrap; }
  .divider hr { flex: 1; border: none; border-top: 1.5px solid #e0d4f7; }
  .day-label {
    max-width: 640px; margin: 0 auto 6px;
    font-size: 0.82rem; font-weight: 700; color: #7c3aed; padding-left: 4px;
  }
  .loading { text-align: center; padding: 30px; color: #9b87b5; font-size: 0.9rem; }
  .spinner {
    display: inline-block; width: 20px; height: 20px;
    border: 2px solid #e0d4f7; border-top-color: #7c3aed;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    margin-right: 8px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1a1a2e; color: white; padding: 10px 20px;
    border-radius: 10px; font-size: 0.88rem; font-weight: 500;
    opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <div class="badge">👯 IIMB GSK Women Support Group</div>
  <h1>LinkedIn Post Board</h1>
  <p class="subtitle">Add your post here. Everyone reacts together. 💜</p>
</div>

<div class="card">
  <h2>➕ Add your LinkedIn post</h2>
  <input type="text" id="nameInput" placeholder="Your name (e.g. Priya)" />
  <div class="row">
    <input type="text" id="urlInput" placeholder="Paste your LinkedIn post URL..." />
    <button class="btn btn-primary" id="addBtn" onclick="addPost()">Add</button>
  </div>
</div>

<div class="topbar">
  <div class="pill" id="countPill">Loading...</div>
  <button class="btn btn-outline" onclick="openAll()">🚀 Open All</button>
</div>

<div class="divider"><hr><span>Posts to React To</span><hr></div>

<div class="posts" id="postsList">
  <div class="loading"><span class="spinner"></span>Loading posts...</div>
</div>

<div class="toast" id="toast"></div>

<script>
  localStorage.removeItem('gsk_script_url');
  const SCRIPT_URL = 'https://script.google.com/a/macros/solvvai.com/s/AKfycbz60g4D-nCl1hH3gVRMY2S4iAD5zSpvtfBKskS5MHTsqxw3XZbWDvtn0V9cdbRz0rF6Jw/exec';

  const EMOJIS = ['🌸','🌺','💫','🌟','✨','🦋','🌈','💐','🌻','🌙'];
  let posts = [];
  let reactedIds = JSON.parse(localStorage.getItem('reacted_ids') || '[]');

  function saveReacted() { localStorage.setItem('reacted_ids', JSON.stringify(reactedIds)); }

  function emoji(name) {
    let h = 0;
    for (let c of name) h = (h + c.charCodeAt(0)) % EMOJIS.length;
    return EMOJIS[h];
  }

  function dayLabel(ts) {
    const d = new Date(ts);
    const today = new Date();
    const yesterday = new Date(); yesterday.setDate(today.getDate() - 1);
    const twoDaysAgo = new Date(); twoDaysAgo.setDate(today.getDate() - 2);
    const fmt = dt => dt.toDateString();
    if (fmt(d) === fmt(today)) return '📅 Today';
    if (fmt(d) === fmt(yesterday)) return '📅 Yesterday';
    if (fmt(d) === fmt(twoDaysAgo)) return '📅 2 Days Ago';
    return '📅 Older';
  }

  function timeStr(ts) {
    return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  async function fetchPosts() {
    try {
      const res = await fetch(`${SCRIPT_URL}?action=getPosts`);
      const data = await res.json();
      posts = data.posts || [];
      render();
    } catch(e) {
      document.getElementById('postsList').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><p>Could not load posts. Check your connection.</p></div>';
    }
  }

  async function addPost() {
    const name = document.getElementById('nameInput').value.trim();
    const url = document.getElementById('urlInput').value.trim();
    if (!name) { showToast('Please enter your name!'); return; }
    if (!url.startsWith('http')) { showToast('Please paste a valid LinkedIn URL!'); return; }

    const btn = document.getElementById('addBtn');
    btn.disabled = true; btn.textContent = 'Adding...';

    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'addPost', name, url })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('urlInput').value = '';
        showToast('✅ Post added!');
        await fetchPosts();
      } else {
        showToast('❌ Error: ' + (data.error || 'Unknown'));
      }
    } catch(e) { showToast('❌ Network error. Try again.'); }

    btn.disabled = false; btn.textContent = 'Add';
  }

  async function deletePost(id) {
    if (!confirm('Remove this post?')) return;
    try {
      await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'deletePost', id }) });
      showToast('🗑️ Post removed.');
      await fetchPosts();
    } catch(e) { showToast('❌ Could not remove post.'); }
  }

  function toggleReacted(id) {
    if (reactedIds.includes(id)) reactedIds = reactedIds.filter(x => x !== id);
    else reactedIds.push(id);
    saveReacted(); render();
  }

  function openAll() {
    if (!posts.length) { showToast('No posts yet!'); return; }
    posts.forEach(p => window.open(p.url, '_blank'));
  }

  function render() {
    document.getElementById('countPill').textContent = posts.length + ' post' + (posts.length !== 1 ? 's' : '') + ' · last 3 days';
    const list = document.getElementById('postsList');

    if (!posts.length) {
      list.innerHTML = '<div class="empty"><div class="empty-icon">🔗</div><p>No posts yet — be the first to add yours!</p></div>';
      return;
    }

    const groups = {}, seen = [];
    posts.forEach(p => {
      const lbl = dayLabel(p.ts);
      if (!groups[lbl]) { groups[lbl] = []; seen.push(lbl); }
      groups[lbl].push(p);
    });
    Object.values(groups).forEach(g => g.sort((a, b) => a.ts - b.ts));
    const dayOrder = ['📅 Today', '📅 Yesterday', '📅 2 Days Ago', '📅 Older'];
    seen.sort((a, b) => dayOrder.indexOf(a) - dayOrder.indexOf(b));

    let html = '';
    seen.forEach(lbl => {
      html += `<div class="day-label">${lbl}</div>`;
      groups[lbl].forEach((p, i) => {
        const pos = i + 1;
        const medal = pos === 1 ? '🥇' : pos === 2 ? '🥈' : pos === 3 ? '🥉' : `<span style="font-size:0.85rem;font-weight:800;color:#4B0082;">#${pos}</span>`;
        const reacted = reactedIds.includes(p.id);
        html += `
        <div class="post-card">
          <div style="min-width:26px;text-align:center;font-size:1.1rem;flex-shrink:0;">${medal}</div>
          <div class="avatar">${emoji(p.name)}</div>
          <div class="info">
            <div class="name">${esc(p.name)}</div>
            <div class="meta">Added at ${timeStr(p.ts)}</div>
          </div>
          <div class="actions">
            <button style="font-size:0.75rem;padding:5px 9px;border-radius:7px;font-weight:600;cursor:pointer;border:none;font-family:inherit;background:${reacted?'#d1fae5':'#fff7ed'};color:${reacted?'#047857':'#c2410c'};"
              onclick="toggleReacted('${p.id}')">
              ${reacted ? '✅ Reacted' : '⏳ To React'}
            </button>
            <a href="${esc(p.url)}" target="_blank" class="btn-open">👍 Open</a>
            <button class="del-btn" onclick="deletePost('${p.id}')" title="Remove">✕</button>
          </div>
        </div>`;
      });
      html += '<div style="height:10px;"></div>';
    });
    list.innerHTML = html;
  }

  setInterval(fetchPosts, 60000);
  fetchPosts();
</script>
</body>
</html>
